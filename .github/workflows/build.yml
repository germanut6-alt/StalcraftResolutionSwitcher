name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build executable
        shell: powershell
        run: .\build.ps1

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: StalcraftResolutionSwitcher-windows
          path: dist/StalcraftResolutionSwitcher-win.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME .\dist\StalcraftResolutionSwitcher-win.zip --generate-notes --title $env:GITHUB_REF_NAME
